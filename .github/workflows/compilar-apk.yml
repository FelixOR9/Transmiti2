name: TRANSMITI2 - Compilar APK de depuración

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Aplicar el paquete de actualización (si hay uno)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in actualizacion*.zip; do
            echo "Paquete encontrado: $pkg"
            unzip -tq "$pkg"
            if unzip -Z1 "$pkg" | grep -E '^(/|\.git)|(^|/)\.\.(/|$)'; then
              echo "El paquete contiene rutas no permitidas."
              exit 1
            fi
            echo "Archivos del paquete:"
            unzip -Z1 "$pkg" | grep -v '/$'
            unzip -oq "$pkg"
            git rm -q -f "$pkg"
          done

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar SQLite del sistema (para las pruebas de la base de datos)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev

      - name: Versión de Flutter
        run: flutter --version

      - name: Agregar las dependencias que falten
        run: |
          set -euo pipefail
          add() { grep -q "^  $1:" pubspec.yaml || flutter pub add "$1"; }
          add sqflite
          add path_provider
          add path
          add image_picker
          grep -q "^  sqflite_common_ffi:" pubspec.yaml || flutter pub add --dev sqflite_common_ffi

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: Compilar el APK de depuración
        run: flutter build apk --debug

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: transmiti2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Guardar el proyecto en la rama
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Etapa 2: actualización verificada (analyze, test y APK)"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Publicar el APK de prueba en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-$GITHUB_REF_NAME"
          cp build/app/outputs/flutter-apk/app-debug.apk transmiti2-debug.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" transmiti2-debug.apk \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "TRANSMITI2 - APK de depuración ($GITHUB_REF_NAME)" \
            --notes "APK de depuración generado automáticamente desde la rama $GITHUB_REF_NAME. Solo para pruebas."
