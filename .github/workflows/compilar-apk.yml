name: TRANSMITI2 - Compilar APK de depuración

# Fase 3.0 — CI solo de verificación.
# Eliminado: ingesta de paquetes ZIP, agregado automático de dependencias,
# auto-commit/push del bot y publicación automática en Releases.
# El CI ya no escribe en el repositorio: permissions contents: read.
# Dispara en push y pull_request a Etapa-3, y manualmente.
#
# CAMBIO v2 (pruebas Kotlin): se agrega el paso "Pruebas unitarias Kotlin"
# (./gradlew :app:testDebugUnitTest), que ejecuta StreamAadTest.kt: AAD
# canónico por destino, validación de URL RTMPS y guarda de Keystore que
# falla cerrado. Hasta ahora esas 3 pruebas no se habían ejecutado en
# ningún lado: el APK compilaba, pero los tests Kotlin no corrían.
# Si fallan, el CI falla antes de subir el artefacto.
#
# CAMBIO v3 (firma estable, 3.1.3): antes del build se restaura el
# keystore debug dedicado desde el secreto
# TRANSMITI2_DEBUG_KEYSTORE_BASE64 y se exportan sus credenciales
# (TRANSMITI2_DEBUG_KEYSTORE_PASSWORD, TRANSMITI2_DEBUG_KEY_ALIAS,
# TRANSMITI2_DEBUG_KEY_PASSWORD) para que Gradle firme con esa clave
# en lugar de generar una nueva en cada run. Si un secreto falta, el
# paso falla con mensaje claro. Después del build se imprime la huella
# SHA-256 del certificado del APK con apksigner para verificar que la
# firma es la esperada.
#
# NOTA (Fase 3.0): android/gradlew, android/gradlew.bat y
# android/gradle/wrapper/gradle-wrapper.jar NO están en el repositorio:
# android/.gitignore los excluye (es el .gitignore estándar de Flutter).
# Por eso la verificación de versiones SDK y las pruebas Kotlin con
# ./gradlew VAN DESPUÉS de "flutter build apk --debug": ese paso regenera
# el wrapper (gradlew + gradle-wrapper.jar) antes de invocarlo. No mover
# los pasos de ./gradlew antes del build, porque en un checkout limpio
# no existe ./gradlew.

on:
  push:
    branches: [Etapa-3]
  pull_request:
    branches: [Etapa-3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar SQLite del sistema (para las pruebas de la base de datos)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev

      - name: Versión de Flutter
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: Restaurar keystore de firma estable
        run: |
          if [ -z "${{ secrets.TRANSMITI2_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: falta el secreto TRANSMITI2_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          if [ -z "${{ secrets.TRANSMITI2_DEBUG_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.TRANSMITI2_DEBUG_KEY_ALIAS }}" ] || [ -z "${{ secrets.TRANSMITI2_DEBUG_KEY_PASSWORD }}" ]; then
            echo "ERROR: falta uno de los secretos TRANSMITI2_DEBUG_KEYSTORE_PASSWORD, TRANSMITI2_DEBUG_KEY_ALIAS o TRANSMITI2_DEBUG_KEY_PASSWORD" >&2
            exit 1
          fi
          mkdir -p ~/.android
          echo "${{ secrets.TRANSMITI2_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore || { echo "ERROR: el keystore restaurado está vacío" >&2; exit 1; }
          {
            echo "TRANSMITI2_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore"
            echo "TRANSMITI2_DEBUG_KEYSTORE_PASSWORD=${{ secrets.TRANSMITI2_DEBUG_KEYSTORE_PASSWORD }}"
            echo "TRANSMITI2_DEBUG_KEY_ALIAS=${{ secrets.TRANSMITI2_DEBUG_KEY_ALIAS }}"
            echo "TRANSMITI2_DEBUG_KEY_PASSWORD=${{ secrets.TRANSMITI2_DEBUG_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "Keystore de firma estable restaurado en ~/.android/debug.keystore"

      - name: Compilar el APK de depuración
        env:
          ORG_GRADLE_PROJECT_transmiti2TestMode: 'true'
        run: flutter build apk --debug

      - name: Verificar modo de pruebas activo en el build
        run: |
          # El buildDir de Gradle está reubicado por android/build.gradle.kts
          # a <repo>/build/app (no a android/app/build): ahí vive el
          # BuildConfig generado. Se exige el valor true, no solo que el
          # campo exista (si la propiedad no llegara a Gradle, sería false).
          CFG=$(find build/app/generated -name "BuildConfig.java" -path "*debug*" 2>/dev/null | head -n 1)
          if [ -z "$CFG" ]; then echo "ERROR: no se encontró BuildConfig.java de debug en build/app/generated"; find build/app/generated -maxdepth 4 -type d 2>/dev/null | head -20; exit 1; fi
          echo "BuildConfig: $CFG"
          grep -H "TRANSMITI2_TEST_MODE = true" "$CFG" || { echo "ERROR: TRANSMITI2_TEST_MODE no está en true en el BuildConfig generado"; exit 1; }

      - name: Verificar firma del APK
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          echo "aapt2: $AAPT2"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"

      - name: Pruebas unitarias Kotlin
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Verificar versiones SDK efectivas
        working-directory: android
        run: ./gradlew :app:printTransmiti2SdkVersions

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: transmiti2-test-apk-etapa3
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
