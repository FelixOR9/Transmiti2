        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/etapa1.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/etapa1.tar.gz" | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/etapa1.tar.gz" | grep -v '/$'
          rm -f lib/features/home/presentation/widgets/menu_card.dart
          tar -xzf "$RUNNER_TEMP/etapa1.tar.gz"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Crear la parte Android (solo la primera vez)
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.transmiti2 --project-name transmiti2 .
          fi
          sed -i 's/android:label="[^"]*"/android:label="TRANSMITI2"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      - name: Compilar el APK de depuración
        run: flutter build apk --debug

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: transmiti2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Guardar el proyecto en el repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Etapa 1: estructura Flutter, pantalla de inicio y navegación"
            git push
          fi

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-debug.apk transmiti2-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest transmiti2-debug.apk \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "TRANSMITI2 - APK de depuración" \
            --notes "APK de depuración generado automáticamente. Solo para pruebas."
