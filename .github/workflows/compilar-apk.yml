name: TRANSMITI2 - Compilar APK de depuración

# Fase 3.0 — CI solo de verificación.
# Eliminado: ingesta de paquetes ZIP, agregado automático de dependencias,
# auto-commit/push del bot y publicación automática en Releases.
# El CI ya no escribe en el repositorio: permissions contents: read.
# Dispara en push y pull_request a Etapa-3, y manualmente.

on:
  push:
    branches: [Etapa-3]
  pull_request:
    branches: [Etapa-3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar SQLite del sistema (para las pruebas de la base de datos)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev

      - name: Versión de Flutter
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: Verificar versiones SDK efectivas
        working-directory: android
        run: ./gradlew :app:printTransmiti2SdkVersions

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: Compilar el APK de depuración
        run: flutter build apk --debug

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: transmiti2-debug-apk-etapa3
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
